# backend/src/main/resources/application-prod.yml
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate  # Never use 'update' in production
    show-sql: false
  
logging:
  level:
    com.school: INFO
    org.springframework.security: WARN