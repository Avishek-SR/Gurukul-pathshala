# backend/src/main/resources/application-prod.yml
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update  # Changed from validate to allow table creation on fresh deploy
    show-sql: false
  
logging:
  level:
    com.school: INFO
    org.springframework.security: WARN